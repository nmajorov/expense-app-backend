apiVersion: v1
kind: ConfigMap
metadata:
  name: expense-app-backend-config
  labels:
    app: expense-app-backend
data:
  config.yaml: |
    web:
      port: 7000

    database:
      type: "postgres"
      # connectionUrl (and optionally user/passwd) is supplied at runtime via
      # the DATABASE_CONNECTION_URL / DATABASE_USER / DATABASE_PASSWD env
      # vars, sourced from a Secret provisioned out-of-band (not in git).

    jwt:
      maxAgeHours: 4
      # signingKey is supplied at runtime via the JWT_SIGNING_KEY env var,
      # sourced from a Secret provisioned out-of-band (not in git).
